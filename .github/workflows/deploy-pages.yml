name: Deploy Docs & Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run build:demo

      - name: Prepare pages artifact
        run: |
          # docs/ already contains index.html (docs site) + demo/ (built demo app)
          # Copy worker files into the demo output since they are gitignored
          mkdir -p docs/demo/workers
          if [ -d demo/public/workers ]; then
            cp -r demo/public/workers/* docs/demo/workers/ 2>/dev/null || true
          fi
          # Copy font files into the demo output
          mkdir -p docs/demo/fonts
          if [ -d demo/public/fonts ]; then
            cp -r demo/public/fonts/* docs/demo/fonts/ 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
